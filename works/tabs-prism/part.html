<div data-ld-part="tabs-prism" lang="ja">
  <canvas class="scene" aria-hidden="true"></canvas>
  <div class="tabs" role="tablist" aria-label="期間">
    <button class="tab" type="button" role="tab" id="tabs-prism-day" aria-selected="false" aria-controls="tabs-prism-panel" tabindex="-1"><span class="word">日</span></button>
    <button class="tab" type="button" role="tab" id="tabs-prism-week" aria-selected="true" aria-controls="tabs-prism-panel"><span class="word">週</span></button>
    <button class="tab" type="button" role="tab" id="tabs-prism-month" aria-selected="false" aria-controls="tabs-prism-panel" tabindex="-1"><span class="word">月</span></button>
    <button class="tab" type="button" role="tab" id="tabs-prism-year" aria-selected="false" aria-controls="tabs-prism-panel" tabindex="-1"><span class="word">年</span></button>
  </div>
  <div class="panel" id="tabs-prism-panel" role="tabpanel" aria-labelledby="tabs-prism-week">週ごとの表示</div>
  <span class="probe" aria-hidden="true"></span>
</div>
