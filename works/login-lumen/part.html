<div data-ld-part="login-lumen" lang="ja">
  <canvas class="scene" aria-hidden="true"></canvas>

  <main class="stage">
    <section class="card" aria-labelledby="ll-title" data-card>
      <header class="head rise">
        <h1 class="title" id="ll-title" tabindex="-1">ログイン</h1>
        <p class="lead">ログインして続けてください</p>
      </header>

      <form class="form" data-form novalidate>
        <div class="field rise">
          <label class="label" for="ll-email">メールアドレス</label>
          <input class="input" id="ll-email" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" required data-validate="email" aria-describedby="ll-email-error">
          <p class="error" id="ll-email-error" hidden></p>
        </div>
        <div class="field rise">
          <label class="label" for="ll-password">パスワード</label>
          <input class="input" id="ll-password" name="password" type="password" autocomplete="current-password" required data-validate="password" aria-describedby="ll-password-error">
          <p class="error" id="ll-password-error" hidden></p>
        </div>
        <button class="submit rise" type="submit" data-busy="ログイン中…"><span class="submit-text">ログイン</span></button>
      </form>
    </section>

    <section class="welcome" data-welcome tabindex="-1" hidden>
      <h2 class="welcome-title">ようこそ</h2>
      <p class="welcome-text">Ludion</p>
      <button class="link" type="button" data-return>ログイン画面に戻る</button>
    </section>
  </main>

  <span class="probe" aria-hidden="true"></span>
</div>
