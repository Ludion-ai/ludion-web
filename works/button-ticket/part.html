<div data-ld-part="button-ticket">
  <div class="head">
    <span class="caption">Number of tickets</span>
    <span class="code">No. 07</span>
  </div>
  <div class="keys">
    <div class="numbers" role="group" aria-label="Number of tickets">
      <span class="bezel"><button class="key num" type="button" aria-pressed="false">1</button></span>
      <span class="bezel"><button class="key num" type="button" aria-pressed="false">2</button></span>
      <span class="bezel"><button class="key num" type="button" aria-pressed="false">3</button></span>
      <span class="bezel"><button class="key num" type="button" aria-pressed="false">4</button></span>
    </div>
    <span class="bezel wide"><button class="key buy" type="button">Buy ticket</button></span>
    <span class="bezel"><button class="key cancel" type="button">Cancel</button></span>
  </div>
</div>
