<div data-ld-part="progress-ferro" lang="ja">
  <canvas class="scene" aria-hidden="true"></canvas>
  <div class="bar" role="progressbar" aria-label="アップロードの進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%" tabindex="-1" data-bar></div>
  <div class="readout">
    <p class="state" role="status" aria-live="polite" data-state>アップロード中</p>
    <p class="value" aria-hidden="true"><span data-value>0</span><span class="unit">%</span></p>
    <button class="again" type="button" data-again>もう一度</button>
  </div>
  <span class="probe" aria-hidden="true"></span>
</div>
