<div data-ld-part="toggle-audio">
  <div class="head">
    <span class="title">Connections</span>
    <span class="code">SW 3</span>
  </div>
  <div class="row">
    <span class="lamp" aria-hidden="true"></span>
    <span class="text">
      <span class="label">Wi-Fi</span>
      <span class="hint">Home network</span>
    </span>
    <span class="control">
      <span class="mark" aria-hidden="true">0</span>
      <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Wi-Fi"><span class="knob"></span></button>
      <span class="mark" aria-hidden="true">1</span>
    </span>
  </div>
  <div class="row">
    <span class="lamp" aria-hidden="true"></span>
    <span class="text">
      <span class="label">Bluetooth</span>
      <span class="hint">2 devices nearby</span>
    </span>
    <span class="control">
      <span class="mark" aria-hidden="true">0</span>
      <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Bluetooth"><span class="knob"></span></button>
      <span class="mark" aria-hidden="true">1</span>
    </span>
  </div>
  <div class="row">
    <span class="lamp" aria-hidden="true"></span>
    <span class="text">
      <span class="label">Focus</span>
      <span class="hint">Silent until 18:00</span>
    </span>
    <span class="control">
      <span class="mark" aria-hidden="true">0</span>
      <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Focus"><span class="knob"></span></button>
      <span class="mark" aria-hidden="true">1</span>
    </span>
  </div>
</div>
