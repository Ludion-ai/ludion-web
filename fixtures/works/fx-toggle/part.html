<div data-ld-part="fx-toggle">
  <div class="row">
    <div class="text">
      <span class="label">Wi-Fi</span>
      <span class="hint">Home network</span>
    </div>
    <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Wi-Fi"></button>
  </div>
  <div class="row">
    <div class="text">
      <span class="label">Bluetooth</span>
      <span class="hint">2 devices nearby</span>
    </div>
    <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Bluetooth"></button>
  </div>
  <div class="row">
    <div class="text">
      <span class="label">Focus mode</span>
      <span class="hint">Silence until 6 pm</span>
    </div>
    <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Focus mode"></button>
  </div>
</div>
