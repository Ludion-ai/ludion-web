<div data-ld-part="fx-form">
  <form class="form" novalidate>
    <h2 class="title">Join the list</h2>
    <label class="label" for="fx-form-email">Email</label>
    <input class="input" id="fx-form-email" name="email" type="email" autocomplete="email" aria-describedby="fx-form-error">
    <p class="error" id="fx-form-error" role="alert" hidden>Enter an email address with an @.</p>
    <p class="done" role="status" hidden>You're on the list.</p>
    <button class="submit" type="submit">Join</button>
  </form>
</div>
