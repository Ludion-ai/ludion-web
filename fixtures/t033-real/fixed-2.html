<div data-ld-part="my-ui" lang="ja">
  <button class="ripple-btn" type="button">押してみて</button>
</div>
<style>
[data-ld-part="my-ui"] {
  /* 外から --ld-* で差し替えられる変数 */
  --_bg: var(--ld-bg, #f4f1ea);
  --_fg: var(--ld-fg, #1f2a2e);
  --_accent: var(--ld-accent, #1f5f6b);
  --_radius: var(--ld-radius, 14px);
  --_font: var(--ld-font, system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif);
  --_space: var(--ld-space, 16px);
  --_shadow: var(--ld-shadow, 0 6px 18px rgba(31, 95, 107, 0.28));
  --_motion: var(--ld-motion, 200ms);
  /* この部品の中だけで使う変数 */
  --_accent-hover: #227080;
  --_on-accent: #ffffff;
  --_ripple: rgba(255, 255, 255, 0.55);
  --_focus: #e0a43a;

  box-sizing: border-box;
  min-height: 100%;
  margin: 0;
  background: var(--_bg);
  color: var(--_fg);
  font-family: var(--_font);
  display: grid;
  place-items: center;
  padding: var(--_space);
}
@media (prefers-color-scheme: dark) {
  [data-ld-part="my-ui"]:not([data-theme="light"]) {
    --_bg: var(--ld-bg, #12181b);
    --_fg: var(--ld-fg, #e6e9ea);
    --_accent: var(--ld-accent, #4fb3c2);
    --_shadow: var(--ld-shadow, 0 6px 22px rgba(79, 179, 194, 0.25));
    --_accent-hover: #63c3d1;
    --_on-accent: #0d1a1d;
    --_ripple: rgba(255, 255, 255, 0.6);
    --_focus: #f0bb5c;
  }
}
[data-ld-part="my-ui"][data-theme="dark"] {
  --_bg: var(--ld-bg, #12181b);
  --_fg: var(--ld-fg, #e6e9ea);
  --_accent: var(--ld-accent, #4fb3c2);
  --_shadow: var(--ld-shadow, 0 6px 22px rgba(79, 179, 194, 0.25));
  --_accent-hover: #63c3d1;
  --_on-accent: #0d1a1d;
  --_ripple: rgba(255, 255, 255, 0.6);
  --_focus: #f0bb5c;
}

[data-ld-part="my-ui"] * { box-sizing: border-box; }

[data-ld-part="my-ui"] .ripple-btn {
  position: relative;
  overflow: hidden;               /* 波紋をボタンの形に切り抜く */
  border: 0;
  border-radius: var(--_radius);
  padding: 18px 44px;
  font: inherit;
  font-size: 1.125rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--_on-accent);
  background: var(--_accent);
  box-shadow: var(--_shadow);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--_motion) ease, transform calc(var(--_motion) * 0.6) ease;
}
[data-ld-part="my-ui"] .ripple-btn:hover { background: var(--_accent-hover); }
[data-ld-part="my-ui"] .ripple-btn:active { transform: scale(0.97); }
[data-ld-part="my-ui"] .ripple-btn:focus-visible {
  outline: 3px solid var(--_focus);
  outline-offset: 3px;
}

[data-ld-part="my-ui"] .ripple {
  position: absolute;
  border-radius: 50%;
  background: var(--_ripple);
  transform: scale(0);
  pointer-events: none;
  animation: ld-my-ui-ripple calc(var(--_motion) * 3.25) ease-out forwards;
}
@keyframes ld-my-ui-ripple {
  to { transform: scale(1); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  [data-ld-part="my-ui"] .ripple { animation-duration: 1ms; }
  [data-ld-part="my-ui"] .ripple-btn { transition: none; }
}
</style>
<script type="module">
function mount(root) {
  const btn = root.querySelector('.ripple-btn');
  const ac = new AbortController();
  const { signal } = ac;

  function spawnRipple(x, y) {
    const rect = btn.getBoundingClientRect();
    // 押した点からボタンの一番遠い角まで届く半径
    const dx = Math.max(x, rect.width - x);
    const dy = Math.max(y, rect.height - y);
    const radius = Math.hypot(dx, dy);

    btn.insertAdjacentHTML('beforeend', '<span class="ripple"></span>');
    const ripple = btn.lastElementChild;
    ripple.style.width = ripple.style.height = radius * 2 + 'px';
    ripple.style.left = x - radius + 'px';
    ripple.style.top = y - radius + 'px';
    const done = () => ripple.remove();
    ripple.addEventListener('animationend', done, { once: true, signal });
    ripple.addEventListener('animationcancel', done, { once: true, signal });
  }

  // マウス・タッチ・ペン：押した位置から広がる
  btn.addEventListener('pointerdown', (e) => {
    const rect = btn.getBoundingClientRect();
    spawnRipple(e.clientX - rect.left, e.clientY - rect.top);
  }, { signal });

  // キーボード（Enter / Space）：中央から広がる
  btn.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
      spawnRipple(btn.offsetWidth / 2, btn.offsetHeight / 2);
    }
  }, { signal });

  return () => {
    ac.abort();
    root.querySelectorAll('.ripple').forEach((el) => el.remove());
  };
}
mount(document.querySelector('[data-ld-part="my-ui"]'));
</script>
