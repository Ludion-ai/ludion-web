<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波紋ボタン</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1f2a30;
    --btn: #1f5f6b;
    --btn-hover: #19505a;
    --btn-ink: #ffffff;
    --ripple: rgba(255, 255, 255, 0.45);
    --ring: #e0a43a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181b;
      --ink: #e6e2d9;
      --btn: #4fa3b0;
      --btn-hover: #63b4c0;
      --btn-ink: #0d1416;
      --ripple: rgba(255, 255, 255, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181b;
    --ink: #e6e2d9;
    --btn: #4fa3b0;
    --btn-hover: #63b4c0;
    --btn-ink: #0d1416;
    --ripple: rgba(255, 255, 255, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }

  .ripple-btn {
    position: relative;
    overflow: hidden;           /* 波紋をボタンの形に切り抜く */
    padding: 18px 44px;
    border: 0;
    border-radius: 999px;
    background: var(--btn);
    color: var(--btn-ink);
    font: inherit;
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background-color 0.2s, transform 0.1s;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
  }
  .ripple-btn:hover { background: var(--btn-hover); }
  .ripple-btn:active { transform: scale(0.98); }
  .ripple-btn:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 3px;
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: var(--ripple);
    transform: scale(0);
    pointer-events: none;
    animation: ripple 650ms ease-out forwards;
  }
  @keyframes ripple {
    to { transform: scale(1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ripple { animation-duration: 1ms; }
  }
</style>
</head>
<body>
  <button type="button" class="ripple-btn">押してみて</button>

<script>
  document.querySelectorAll('.ripple-btn').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => spawn(btn, e.clientX, e.clientY));
    // キーボード（Enter / Space）で押したときは中心から広げる
    btn.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === 'Enter' || e.key === ' ') {
        const r = btn.getBoundingClientRect();
        spawn(btn, r.left + r.width / 2, r.top + r.height / 2);
      }
    });
  });

  function spawn(btn, x, y) {
    const rect = btn.getBoundingClientRect();
    const cx = x - rect.left;
    const cy = y - rect.top;
    // 押した点から一番遠い角まで届く半径
    const radius = Math.hypot(
      Math.max(cx, rect.width - cx),
      Math.max(cy, rect.height - cy)
    );
    const dot = document.createElement('span');
    dot.className = 'ripple';
    dot.style.width = dot.style.height = radius * 2 + 'px';
    dot.style.left = cx - radius + 'px';
    dot.style.top = cy - radius + 'px';
    btn.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove());
  }
</script>
</body>
</html>
